{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbv.fullname" . }}
  labels:
    {{- include "dbv.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq (.Values.config.dbEngine | default "mongodb") "mysql" }}
  MYSQL_URI: {{ .Values.config.mysqlUri | required "config.mysqlUri is required when config.dbEngine=mysql" | quote }}
  {{- else }}
  MONGODB_URI: {{ .Values.config.mongodbUri | required "config.mongodbUri is required" | quote }}
  {{- end }}
{{- end }}
